[project]
name = "stage-director-agent"
version = "0.1.0"
description = "무대 연출 디렉터 에이전트 (Python, LangGraph)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stage_director", "contracts"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
